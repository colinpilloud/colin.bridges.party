name: Publish to S3

env:
  AWS_REGION: us-west-2
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  AWS_S3_BUCKET: ${{ vars.AWS_S3_BUCKET }}
  AWS_CLOUDFRONT_CDN: ${{ vars.AWS_CLOUDFRONT_CDN }}

on:
  push:
    branches:
      - development

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build project
        run: yarn build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/github_oidc_build_image_push
          role-session-name: github-colin-bridges-party-push
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync files to S3
        run: |
          aws s3 cp dist s3://${{ env.AWS_S3_BUCKET }} --recursive --exclude "index.html" --cache-control max-age=31536000
          aws s3 cp dist/index.html s3://${{ env.AWS_S3_BUCKET }} --cache-control no-cache

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ env.AWS_CLOUDFRONT_CDN }} --paths "/index.html"
